[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rail"
version = "0.1.0"
description = "Lightweight workflow runtime for agentic coding tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
rail = "rail.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
